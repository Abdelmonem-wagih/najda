name: najda
description: "Najda - Unified Emergency Response App for Citizens & Paramedics"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  flutter_svg: ^2.3.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.4
  cloud_functions: ^5.1.4

  # HTTP & Functional Error Handling
  dio: ^5.3.2
  dartz: ^0.10.1

  # Location Services
  geolocator: ^10.1.0
  location: ^5.0.3

  # Maps
  google_maps_flutter: ^2.10.1
  flutter_polyline_points: ^3.1.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Background Service
  flutter_background_service: ^5.0.5

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Utils
  flutter_dotenv: ^5.1.0
  http: ^1.2.0
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  permission_handler: ^11.1.0
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  share_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true   # enables flutter gen-l10n (AppLocalizations)

  assets:
    - .env
    - assets/fonts/
    - assets/svg/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800